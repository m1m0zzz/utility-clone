# This starter workflow is for a CMake project running on multiple platforms. There is a different starter workflow if you just want a single platform.
# See: https://github.com/actions/starter-workflows/blob/main/ci/cmake-single-platform.yml
name: CMake on multiple platforms

on:
  push:
    branches: [ "main", "develop" ]
    # v1.2.0 のようなタグを push すると、ビルドした成果物を GitHub Release に載せる
    tags: [ "v*" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      # Set fail-fast to false to ensure that feedback is delivered for all matrix combinations. Consider changing this to true when your workflow is stable.
      fail-fast: false

      # To add more build types (Release, Debug, RelWithDebInfo, etc.) customize the build_type list.
      matrix:
        # windows: cl
        # mac: clang
        # ubuntu: clang, gcc
        os: [windows-latest, macos-latest, ubuntu-latest]
        build_type: [Release]
        c_compiler: [cl, clang, gcc]
        include:
          - os: windows-latest
            c_compiler: cl
            cpp_compiler: cl
            release_branch: windows
          - os: macos-latest
            c_compiler: clang
            cpp_compiler: clang++
            release_branch: macos
          - os: ubuntu-latest
            c_compiler: gcc
            cpp_compiler: g++
            package_name: g++
          - os: ubuntu-latest
            c_compiler: clang
            cpp_compiler: clang++
            package_name: clang
            release_branch: linux
        exclude:
          - os: windows-latest
            c_compiler: clang
          - os: windows-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: cl
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
      with:
        # include JUCE folder
        submodules: true

    - uses: maxim-lobanov/setup-xcode@v1
      if: matrix.os == 'macos-latest'
      with:
        xcode-version: latest-stable

    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "release-dir=${{ github.workspace }}/build/Source/UtilityClone_artefacts/Release" >> "$GITHUB_OUTPUT"

    - name: Set macOS deployment target
      # 指定しないとランナーの macOS が deployment target になり、新しい SDK で廃止された API がエラーになる。
      # CMake はこの環境変数から CMAKE_OSX_DEPLOYMENT_TARGET を決め、JUCE の juceaide のビルドにも引き継がれる
      if: matrix.os == 'macos-latest'
      run: echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"

    - name: Use LLVM archiver for clang LTO
      # clang の LTO はビットコードを出すため、GNU ar で作った静的ライブラリからはシンボルを解決できない
      if: matrix.os == 'ubuntu-latest' && matrix.c_compiler == 'clang'
      run: |
        major=$(clang -dumpversion | cut -d. -f1)
        ar=$(command -v llvm-ar || command -v "llvm-ar-$major")
        ranlib=$(command -v llvm-ranlib || command -v "llvm-ranlib-$major")
        echo "EXTRA_CMAKE_ARGS=-DCMAKE_AR=$ar -DCMAKE_RANLIB=$ranlib" >> "$GITHUB_ENV"

    - name: Install Dependencies for Ubuntu
      # https://github.com/juce-framework/JUCE/blob/master/docs/Linux%20Dependencies.md
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install ${{ matrix.package_name }} \
          libasound2-dev libjack-jackd2-dev \
          ladspa-sdk \
          libcurl4-openssl-dev  \
          libfreetype6-dev \
          libx11-dev libxcomposite-dev libxcursor-dev libxcursor-dev libxext-dev libxinerama-dev libxrandr-dev libxrender-dev \
          libwebkit2gtk-4.1-dev \
          libglu1-mesa-dev mesa-common-dev

    - name: Configure CMake
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CXX_COMPILER=${{ matrix.cpp_compiler }}
        -DCMAKE_C_COMPILER=${{ matrix.c_compiler }}
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        ${{ env.EXTRA_CMAKE_ARGS }}
        -S ${{ github.workspace }}

    - name: Build
      # Build your program with the given configuration. Note that --config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config ${{ matrix.build_type }}

    - name: Test
      working-directory: ${{ steps.strings.outputs.build-output-dir }}
      # Execute tests defined by the CMake configuration. Note that --build-config is needed because the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: ctest --build-config ${{ matrix.build_type }}

    - name: Package
      # 配布するのは各プラグイン形式のフォルダだけ。静的ライブラリや import library は含めない
      if: startsWith(github.ref, 'refs/tags/v') && matrix.release_branch != ''
      shell: bash
      working-directory: ${{ steps.strings.outputs.release-dir }}
      run: |
        rm -f "Utility clone_SharedCode.lib" "libUtility clone_SharedCode.a" "VST3/Utility clone.exp" "VST3/Utility clone.lib"
        dirs=$(ls -d Standalone VST3 AU 2>/dev/null)
        cmake -E tar cf "$GITHUB_WORKSPACE/UtilityClone-$GITHUB_REF_NAME-${{ matrix.release_branch }}.zip" --format=zip $dirs

    - name: Upload package
      if: startsWith(github.ref, 'refs/tags/v') && matrix.release_branch != ''
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-${{ matrix.release_branch }}
        path: UtilityClone-*.zip
        if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Check tag matches project version
      run: |
        version=$(sed -nE 's/^PROJECT\(.*VERSION ([0-9.]+)\).*/\1/p' CMakeLists.txt)
        if [ "v$version" != "$GITHUB_REF_NAME" ]; then
          echo "::error::タグ $GITHUB_REF_NAME と CMakeLists.txt の VERSION（$version）が一致しません"
          exit 1
        fi

    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        pattern: release-*
        merge-multiple: true
        path: dist

    - name: Create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "$GITHUB_REF_NAME" dist/*.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
